services:
  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: dynamic-translate-libretranslate
    restart: unless-stopped
    ports:
      - "${LIBRETRANSLATE_PORT:-5000}:5000"
    env_file:
      - path: .env
        required: false
      - path: ./dynamic-translate/.env
        required: false
      - path: ../dynamic-translate/.env
        required: false
    environment:
      - LT_LOAD_ONLY=${LANGS:-pt,pt-BR,en,es}
      - LT_UPDATE_MODELS=true
      - LT_DISABLE_WEB_UI=false
